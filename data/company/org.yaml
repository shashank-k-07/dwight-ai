# Kestrel Logistics: the fictional Customer's org.
# Used by the synthetic generator (ticket 07), the Policy screen Team picker
# (ticket 14), fixtures, and the classifier's candidate Initiative names
# (cut-list fallback #6). The classifier must not read `usual_resources`,
# `repeated_discoveries` or `weight`: they are generator inputs (ground truth).

company:
  name: Kestrel Logistics
  blurb: >-
    Kestrel runs a freight and last-mile delivery network for mid-size shippers
    across the US and EU: dispatch and routing software, a driver app with
    proof-of-delivery photos, carrier EDI integrations and live ETA forecasts.
    About 1,100 staff; 200 of them use metered AI Agents at work.
  hq: Columbus, OH
  wiki: Perch (https://perch.kestrel.internal)

business_functions:
  - {id: engineering,         name: Engineering}
  - {id: operations,          name: Operations}
  - {id: customer-experience, name: Customer Experience}
  - {id: finance,             name: Finance}
  - {id: marketing,           name: Marketing}

# `handle` is the team's handle on Perch/PagerDuty (used in storage rule ids).
teams:
  - {id: platform,      name: Platform,             business_function: engineering,         handle: platform-core}
  - {id: data-infra,    name: Data Infrastructure,  business_function: engineering,         handle: data-infra}
  - {id: mobile,        name: Mobile,               business_function: engineering,         handle: mobile-apps}
  - {id: forecasting,   name: Forecasting,          business_function: engineering,         handle: forecasting}
  - {id: billing-eng,   name: Billing,              business_function: engineering,         handle: billing-eng}
  - {id: integrations,  name: Integrations,         business_function: engineering,         handle: integrations}
  - {id: routing,       name: Routing,              business_function: engineering,         handle: routing}
  - {id: fleet-ops,     name: Fleet Operations,     business_function: operations,          handle: fleet-ops}
  - {id: warehouse-ops, name: Warehouse Operations, business_function: operations,          handle: warehouse-ops}
  - {id: customer-care, name: Customer Care,        business_function: customer-experience, handle: customer-care}
  - {id: accounting,    name: Accounting & FP&A,    business_function: finance,             handle: accounting}
  - {id: growth,        name: Growth Marketing,     business_function: marketing,           handle: growth}

# Resource id conventions (Trail resource_id):
#   company-docs/<doc_id>.md   the 4 real storage docs (fetched by the Drafter)
#   perch:<space>/<slug>       Perch wiki page via perch-docs-mcp
#   repo:<repo>/<path>         file in a GitHub Enterprise repo
# `tokens` is the approximate size of one full read, for the generator.
# `weight` = relative Session volume (Engineering initiatives sum to ~70).
# `repeated_discoveries[].strength` = share of the Initiative's Sessions that
# (re)discover it.

initiatives:
  - id: storage-cost-reduction
    name: storage cost reduction
    business_function: engineering
    primary_teams: [data-infra, platform, forecasting, mobile]
    description: >-
      Project Tidewater: cut S3 spend 45% by end of Q4 by putting lifecycle
      rules on every non-compliant bucket per the storage tiering policy, using blobctl.
    weight: 9
    usual_resources:
      - {id: company-docs/storage-tiering-policy.md,    tokens: real}
      - {id: company-docs/blobctl-migration-runbook.md, tokens: real}
      - {id: company-docs/storage-cost-dashboard.md,    tokens: real}
      - {id: company-docs/storage-service-ownership.md, tokens: real}
    repeated_discoveries:   # generator copies; the REAL ones come from harness runs (tickets 04/16)
      - {statement: "blobctl needs STORAGE_ENV=staging set, prod is refused", strength: 0.35}
      - {statement: "blobctl --bucket takes the bare bucket name, not an s3:// URI", strength: 0.3}

  - id: auth-migration
    name: auth migration
    business_function: engineering
    primary_teams: [platform, mobile, integrations]
    description: >-
      Move every service and the driver app from the legacy session-cookie auth
      to OIDC via Okta with short-lived tokens, service by service.
    weight: 8
    usual_resources:
      - {id: "perch:ENG/oidc-migration-plan",            tokens: 5200}
      - {id: "perch:ENG/service-auth-matrix",            tokens: 3100}
      - {id: "repo:kestrel/identity/docs/token-exchange.md", tokens: 2400}
      - {id: "repo:kestrel/identity/pkg/oidc/client.go", tokens: 3800}
    repeated_discoveries:
      - {statement: "Staging Okta tenant rejects redirect URIs without a trailing slash", strength: 0.4}
      - {statement: "Service tokens need the kestrel.internal audience, not the service name", strength: 0.25}

  - id: routing-latency
    name: routing latency reduction
    business_function: engineering
    primary_teams: [routing]
    description: >-
      Bring p99 route computation under 400 ms for 500-stop plans: profiling,
      caching distance matrices, and splitting the solver hot path.
    weight: 7
    usual_resources:
      - {id: "repo:kestrel/routing-engine/src/solver/mod.rs",   tokens: 6100}
      - {id: "repo:kestrel/routing-engine/benches/README.md",   tokens: 1400}
      - {id: "perch:ENG/routing-perf-dashboard",                tokens: 2600}
    repeated_discoveries:
      - {statement: "Benchmarks must run with ROUTING_BENCH_SEED fixed or results are not comparable", strength: 0.3}

  - id: invoicing-v2
    name: invoicing v2
    business_function: engineering
    primary_teams: [billing-eng]
    description: >-
      Replace the nightly invoice batch with event-driven invoicing in
      billing-core, including multi-currency and carrier surcharges.
    weight: 7
    usual_resources:
      - {id: "perch:ENG/invoicing-v2-design",                 tokens: 4700}
      - {id: "repo:kestrel/billing-core/billing/invoice.py",  tokens: 3500}
      - {id: "repo:kestrel/billing-core/docs/events.md",      tokens: 1900}
    repeated_discoveries:
      - {statement: "Invoice fixtures must use the EUR sandbox ledger for multi-currency tests", strength: 0.2}

  - id: driver-app-offline-sync
    name: driver app offline sync
    business_function: engineering
    primary_teams: [mobile]
    description: >-
      Let drivers complete stops and capture proof-of-delivery photos with no
      signal, syncing later without duplicates.
    weight: 7
    usual_resources:
      - {id: "repo:kestrel/driver-app/docs/sync-protocol.md",   tokens: 3300}
      - {id: "repo:kestrel/pod-service/api/openapi.yaml",       tokens: 4200}
      - {id: "perch:ENG/offline-sync-rfc",                      tokens: 2900}
    repeated_discoveries:
      - {statement: "pod-service dedupes uploads on the client_capture_id header, not the file hash", strength: 0.3}

  - id: carrier-api-onboarding
    name: carrier API onboarding
    business_function: engineering
    primary_teams: [integrations]
    description: >-
      Onboard new regional carriers onto carrier-connect: EDI 214/210 mapping,
      API credentials and certification tests.
    weight: 8
    usual_resources:
      - {id: "perch:ENG/carrier-onboarding-checklist",           tokens: 2800}
      - {id: "repo:kestrel/carrier-connect/mappings/edi214.ts",  tokens: 3600}
      - {id: "perch:ENG/edi-field-reference",                    tokens: 5400}
    repeated_discoveries:
      - {statement: "Carrier certification tests only pass against the cert-sandbox endpoint", strength: 0.35}

  - id: eta-model-retraining
    name: ETA model retraining
    business_function: engineering
    primary_teams: [forecasting]
    description: >-
      Retrain and validate the ETA forecasting models on the last 12 months of
      telemetry, with new holiday and weather features.
    weight: 6
    usual_resources:
      - {id: "repo:kestrel/eta-forecasting/README.md",            tokens: 2100}
      - {id: "repo:kestrel/eta-forecasting/configs/train.yaml",   tokens: 900}
      - {id: "perch:ENG/eta-feature-catalog",                     tokens: 4300}
    repeated_discoveries:
      - {statement: "The training job needs the feature-store snapshot id pinned, latest is not allowed", strength: 0.25}

  - id: k8s-upgrade
    name: Kubernetes 1.31 upgrade
    business_function: engineering
    primary_teams: [platform]
    description: >-
      Upgrade all EKS clusters to 1.31, replacing deprecated APIs in Helm charts
      and Terraform in platform-infra.
    weight: 6
    usual_resources:
      - {id: "perch:ENG/eks-upgrade-runbook",                        tokens: 3900}
      - {id: "repo:kestrel/platform-infra/modules/eks/main.tf",      tokens: 2700}
      - {id: "perch:ENG/deprecated-api-inventory",                   tokens: 2200}
    repeated_discoveries:
      - {statement: "Node groups must be drained with --delete-emptydir-data or the drain hangs", strength: 0.3}

  - id: incident-postmortems
    name: incident postmortems
    business_function: engineering
    primary_teams: [platform, routing, integrations, data-infra]
    description: >-
      Writing postmortems for production incidents from PagerDuty timelines,
      logs and Slack threads, in the Perch PIR template.
    weight: 5
    usual_resources:
      - {id: "perch:ENG/pir-template",            tokens: 1200}
      - {id: "perch:ENG/severity-definitions",    tokens: 1600}
    repeated_discoveries: []

  - id: shipment-exception-triage
    name: shipment exception triage
    business_function: operations
    primary_teams: [fleet-ops]
    description: >-
      Triage late, damaged and misrouted shipments daily: classify the exception,
      contact the carrier, and update the customer ETA.
    weight: 6
    usual_resources:
      - {id: "perch:OPS/exception-codes",             tokens: 2500}
      - {id: "perch:OPS/carrier-escalation-contacts", tokens: 1800}
    repeated_discoveries:
      - {statement: "Exception code X7 (address unresolved) must go to Customer Care, not the carrier", strength: 0.3}

  - id: dock-scheduling
    name: warehouse dock scheduling
    business_function: operations
    primary_teams: [warehouse-ops]
    description: >-
      Build weekly dock-door schedules for the three cross-dock sites from
      inbound forecasts and labour rosters.
    weight: 4
    usual_resources:
      - {id: "perch:OPS/dock-scheduling-rules", tokens: 2200}
      - {id: "perch:OPS/site-door-inventory",   tokens: 1500}
    repeated_discoveries:
      - {statement: "Columbus doors 14-18 are reefer-only and cannot take dry freight", strength: 0.2}

  - id: support-macro-refresh
    name: support macro refresh
    business_function: customer-experience
    primary_teams: [customer-care]
    description: >-
      Rewrite the Zendesk macros for delivery disputes and damaged goods to
      match the new claims process and tone guide.
    weight: 4
    usual_resources:
      - {id: "perch:CX/claims-process-2026", tokens: 3000}
      - {id: "perch:CX/tone-guide",          tokens: 1700}
    repeated_discoveries:
      - {statement: "Claims over $2,500 must be routed to the claims-portal escalation queue", strength: 0.25}

  - id: month-end-close
    name: month-end close automation
    business_function: finance
    primary_teams: [accounting]
    description: >-
      Automate month-end accruals and carrier cost reconciliation between
      billing-core exports and NetSuite.
    weight: 4
    usual_resources:
      - {id: "perch:FIN/close-checklist",            tokens: 2600}
      - {id: "perch:FIN/netsuite-account-mapping",   tokens: 3400}
    repeated_discoveries:
      - {statement: "Carrier accruals post to GL 5120, not 5100, since the 2026 chart of accounts change", strength: 0.3}

  - id: vendor-contract-review
    name: vendor contract review
    business_function: finance
    primary_teams: [accounting]
    description: >-
      Review SaaS and carrier contracts up for renewal: terms, auto-renew dates
      and price escalators, summarised for Procurement.
    weight: 2
    usual_resources:
      - {id: "perch:FIN/procurement-policy", tokens: 2900}
    repeated_discoveries: []

  - id: peak-season-campaign
    name: Q4 peak season campaign
    business_function: marketing
    primary_teams: [growth]
    description: >-
      Plan and write the Q4 peak-season campaign for shippers: landing pages,
      email sequences and case studies.
    weight: 4
    usual_resources:
      - {id: "perch:MKT/brand-guidelines",   tokens: 2400}
      - {id: "perch:MKT/q4-campaign-brief",  tokens: 1900}
      - {id: "perch:MKT/customer-case-studies", tokens: 3600}
    repeated_discoveries:
      - {statement: "Customer names in case studies need Legal sign-off unless listed in the approved-logos sheet", strength: 0.2}

